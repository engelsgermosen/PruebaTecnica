server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    gzip            on;
    gzip_types      text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # El API se expone bajo el mismo origen para evitar CORS desde el navegador.
    location /api/ {
        proxy_pass         http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Swagger, util para revisar el contrato del API desde el mismo host.
    location /swagger/ {
        proxy_pass         http://api:8080/swagger/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    location = /api-health {
        proxy_pass       http://api:8080/health;
        proxy_set_header Host $host;
    }

    # Los assets con hash pueden cachearse de forma agresiva.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: cualquier ruta desconocida devuelve el index para que React Router resuelva.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
